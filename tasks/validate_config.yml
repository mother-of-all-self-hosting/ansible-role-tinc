---
- name: Fail if required tinc settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - tinc_identifier
    - tinc_uid
    - tinc_gid
    - tinc_container_network
    - tinc_name
    - tinc_private_key

- name: Fail if this node is missing from tinc_hosts
  ansible.builtin.fail:
    msg: >-
      `tinc_hosts` needs an entry for this node, with the name set in `tinc_name` ({{ tinc_name }}).
  when: tinc_name not in (tinc_hosts | map(attribute='name') | list)
