---
- name: Verify tinc
  hosts: all
  become: true
  gather_facts: false

  vars:
    # The unusual values the scenario configures the role with. Written down
    # here rather than read back out of the inventory, so that a verify run
    # compares the running container against something stated, not against
    # whatever the scenario happens to say at the time.
    tinc_expected_uid: 1717
    tinc_expected_gid: 1717
    tinc_expected_timezone: Asia/Tokyo
    tinc_expected_tcp_host_port: "50655"
    tinc_expected_udp_host_port: "51655"
    tinc_expected_address: 10.255.0.1
    tinc_expected_interface_address: "{{ tinc_expected_address }}/24"
    tinc_expected_route: 10.255.2.0/24
    tinc_expected_connect_to: [peer]
    tinc_expected_host_files: [molecule, nat, peer]

    tinc_verify_units:
      - tinc.service

  tasks:
    - name: Verify that tinc works
      block:
        # The role is not included in this playbook, so its defaults are not in
        # scope. Reading defaults/main.yml directly ties the version assertion
        # below.
        - name: Load the role defaults
          ansible.builtin.include_vars:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
            name: tinc_defaults

        - name: Wait for the tinc systemd services to become active (up to 180s each)
          ansible.builtin.systemd_service:
            name: "{{ item }}"
          register: tinc_services
          until: tinc_services.status.ActiveState == 'active'
          retries: 36
          delay: 5
          loop: "{{ tinc_verify_units }}"
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        # `Restart=always` in the systemd unit means that even a container which crashes
        # and gets restarted reads as active here, so this is a precondition rather than
        # a result.
        - name: Assert the tinc systemd services are active
          ansible.builtin.assert:
            that: tinc_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
            fail_msg: >-
              Not every service is active:
              {{ dict(tinc_verify_units | zip(tinc_services.results | map(attribute='status.ActiveState'))) }}
            success_msg: "Every systemd service is active"

        - name: Retrieve the tinc systemd services log for debugging
          when: tinc_debug_service_enabled | bool
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
          changed_when: false
          loop: "{{ tinc_verify_units }}"

        # Queried via the docker CLI rather than community.docker.docker_container_info,
        # because the ansible-lint environment used by pre-commit does not have the
        # community.docker collection and would fail the syntax check. The full JSON
        # is parsed here rather than using `--format`, whose Go templating would
        # collide with Jinja.
        - name: Inspect the running tinc container
          ansible.builtin.command:
            cmd: docker container inspect {{ tinc_defaults.tinc_identifier }}
          register: tinc_container_raw
          changed_when: false

        - name: Parse the tinc container definition
          ansible.builtin.set_fact:
            tinc_container: "{{ (tinc_container_raw.stdout | from_json)[0] }}"

        # ------------------------------------------------------------------
        # What the role told Docker to run
        # ------------------------------------------------------------------

        - name: Collect the mounts the role asked for
          ansible.builtin.set_fact:
            tinc_config_mount: "{{ tinc_container.Mounts | selectattr('Destination', 'equalto', '/etc/tinc') | list }}"
            tinc_extra_mount: "{{ tinc_container.Mounts | selectattr('Destination', 'equalto', tinc_molecule_extra_volume_dst) | list }}"

        - name: Assert that the role's configuration directory is mounted read-only
          ansible.builtin.assert:
            that:
              - tinc_config_mount | length == 1
              - tinc_config_mount[0].Type == 'bind'
              - tinc_config_mount[0].Source == '/' ~ tinc_defaults.tinc_identifier ~ '/config'
              - not tinc_config_mount[0].RW
            fail_msg: "The role's configuration directory is not bind-mounted read-only: {{ tinc_container.Mounts }}"
            success_msg: "The configuration directory is bind-mounted read-only at /etc/tinc"

        # tinc_container_additional_volumes_custom has been inert in several roles in
        # this collection - rendered into a comment, or into a `-v` that silently
        # dropped the options. Both the destination and the readonly option have
        # to arrive.
        - name: Assert that tinc_container_additional_volumes_custom reached the container
          ansible.builtin.assert:
            that:
              - tinc_extra_mount | length == 1
              - tinc_extra_mount[0].Type == 'bind'
              - tinc_extra_mount[0].Source == tinc_molecule_extra_volume_src
              - not tinc_extra_mount[0].RW
            fail_msg: "The additional volume did not reach the container: {{ tinc_container.Mounts }}"
            success_msg: "The additional volume is mounted read-only at {{ tinc_molecule_extra_volume_dst }}"

        # Reading the file back from inside the
        # container is the difference between the variable existing and it working.
        - name: Read the marker through the additional volume
          ansible.builtin.command:
            cmd: >-
              docker exec {{ tinc_defaults.tinc_identifier }}
              cat {{ tinc_molecule_extra_volume_dst }}/{{ tinc_molecule_marker_filename }}
          register: tinc_extra_volume
          changed_when: false

        - name: Assert the additional volume is mounted into the tinc container
          ansible.builtin.assert:
            that:
              - tinc_extra_volume.rc == 0
              - tinc_extra_volume.stdout | trim == tinc_molecule_extra_volume_marker
            fail_msg: "The additional volume did not carry the marker into the container"
            success_msg: "The additional volume carries the marker into the container"

        - name: Assert that the read-only container still gets its writable /run
          ansible.builtin.assert:
            that:
              - tinc_container.HostConfig.ReadonlyRootfs
              - "'/run' in (tinc_container.HostConfig.Tmpfs | default({}))"
            fail_msg: >-
              The container's root filesystem is
              {{ 'read-only' if tinc_container.HostConfig.ReadonlyRootfs else 'writable' }}
              and its tmpfs mounts are {{ tinc_container.HostConfig.Tmpfs | default({}) }}
            success_msg: "The container is read-only with a tmpfs at /run"

        # tincd creates the VPN interface through /dev/net/tun and sets it up
        # with `ip`, which is what NET_ADMIN grants, reads configuration files
        # owned by the role's uid, which is what DAC_READ_SEARCH grants, and
        # binds port 655 under host networking, which is what NET_BIND_SERVICE
        # grants. Everything else is dropped.
        - name: Assert that the container has exactly the capabilities tincd needs
          ansible.builtin.assert:
            that:
              - tinc_container.HostConfig.CapDrop == ['ALL']
              - tinc_container.HostConfig.CapAdd | sort == ['CAP_DAC_READ_SEARCH', 'CAP_NET_ADMIN', 'CAP_NET_BIND_SERVICE']
            fail_msg: >-
              The container drops {{ tinc_container.HostConfig.CapDrop }}
              and adds {{ tinc_container.HostConfig.CapAdd }}
            success_msg: "The container drops every capability except {{ tinc_container.HostConfig.CapAdd | join(', ') }}"

        - name: Assert that the container gets the tun device
          ansible.builtin.assert:
            that:
              - tinc_container.HostConfig.Devices | selectattr('PathInContainer', 'equalto', '/dev/net/tun') | list | length == 1
            fail_msg: "The container gets the devices {{ tinc_container.HostConfig.Devices }}"
            success_msg: "The container gets /dev/net/tun"

        # The scenario publishes on ports nothing else would pick, so that each
        # host port can only have come from its own variable, and swapping the
        # two variables in the systemd unit would not go unnoticed.
        - name: Assert that the TCP and UDP ports are published on the configured host ports
          ansible.builtin.assert:
            that:
              - tinc_container.HostConfig.PortBindings['655/tcp'][0].HostPort == tinc_expected_tcp_host_port
              - tinc_container.HostConfig.PortBindings['655/udp'][0].HostPort == tinc_expected_udp_host_port
            fail_msg: "The container publishes {{ tinc_container.HostConfig.PortBindings }}"
            success_msg: >-
              The container publishes 655/tcp on {{ tinc_expected_tcp_host_port }}
              and 655/udp on {{ tinc_expected_udp_host_port }}

        - name: Assert that the role's timezone reached the container environment
          ansible.builtin.assert:
            that:
              - ('TZ=' ~ tinc_expected_timezone) in tinc_container.Config.Env
            fail_msg: "templates/env.j2 did not put TZ={{ tinc_expected_timezone }} on the container"
            success_msg: "The container environment carries TZ={{ tinc_expected_timezone }}"

        - name: Assert that the container image is the pinned version
          ansible.builtin.assert:
            that:
              - tinc_container.Config.Image == 'ghcr.io/mother-of-all-self-hosting/ansible-role-tinc:' ~ tinc_defaults.tinc_version
            fail_msg: >-
              The container runs {{ tinc_container.Config.Image }}, not the
              {{ tinc_defaults.tinc_version }} pinned in defaults/main.yml
            success_msg: "The container runs {{ tinc_container.Config.Image }}"

        # ------------------------------------------------------------------
        # What the role rendered
        # ------------------------------------------------------------------

        # The configuration files on the host are owned by the role's uid and gid, with
        # the private key kept from other users. tincd runs as root inside the container,
        # and reads them thanks to DAC_READ_SEARCH.
        - name: Check the ownership of the rendered configuration files
          ansible.builtin.stat:
            path: "/{{ tinc_defaults.tinc_identifier }}/config/{{ item.name }}"
          register: tinc_config_files
          loop:
            - {name: tinc.conf, mode: "0640"}
            - {name: rsa_key.priv, mode: "0600"}
            - {name: tinc-up, mode: "0755"}
            - {name: tinc-down, mode: "0755"}
            - {name: hosts/molecule, mode: "0640"}
            - {name: hosts/peer, mode: "0640"}
          loop_control:
            label: "{{ item.name }}"

        - name: Assert the rendered configuration files are owned by the role's uid and gid
          ansible.builtin.assert:
            that:
              - tinc_config_files.results | map(attribute='stat.uid') | unique | list == [tinc_expected_uid]
              - tinc_config_files.results | map(attribute='stat.gid') | unique | list == [tinc_expected_gid]
              - tinc_config_files.results | map(attribute='stat.mode') | list == tinc_config_files.results | map(attribute='item.mode') | list
            fail_msg: >-
              The configuration files are owned by
              {{ tinc_config_files.results | map(attribute='stat.uid') | list }}:{{ tinc_config_files.results | map(attribute='stat.gid') | list }}
              with modes {{ tinc_config_files.results | map(attribute='stat.mode') | list }}
            success_msg: "The configuration files are owned by {{ tinc_expected_uid }}:{{ tinc_expected_gid }} with the expected modes"

        - name: List the host files
          ansible.builtin.find:
            paths: "/{{ tinc_defaults.tinc_identifier }}/config/hosts"
            file_type: any
          register: tinc_host_files

        # prepare.yml left the host file of a node which is not in `tinc_hosts` behind.
        - name: Assert there is a host file for every listed node, and for no other
          ansible.builtin.assert:
            that: tinc_host_files.files | map(attribute='path') | map('basename') | sort == tinc_expected_host_files
            fail_msg: "The hosts directory holds {{ tinc_host_files.files | map(attribute='path') | map('basename') | sort }}"
            success_msg: "The hosts directory holds {{ tinc_expected_host_files | join(', ') }}"

        - name: Read the rendered tinc.conf
          ansible.builtin.slurp:
            src: "/{{ tinc_defaults.tinc_identifier }}/config/tinc.conf"
          register: tinc_conf

        # By default the node connects to every other node with addresses. `nat`
        # has none, and the node must not connect to itself.
        - name: Assert the node connects to the nodes with addresses
          ansible.builtin.assert:
            that: (tinc_conf.content | b64decode | regex_findall('(?m)^ConnectTo = (\S+)$')) == tinc_expected_connect_to
            fail_msg: "tinc.conf holds {{ tinc_conf.content | b64decode }}"
            success_msg: "tinc.conf connects to {{ tinc_expected_connect_to | join(', ') }}"

        # ------------------------------------------------------------------
        # What tincd inside the container actually did
        # ------------------------------------------------------------------

        - name: Ask tincd for its version
          ansible.builtin.command:
            cmd: docker exec {{ tinc_defaults.tinc_identifier }} tincd --version
          register: tinc_daemon_version
          changed_when: false

        - name: Assert the running tincd is the version this role installs
          ansible.builtin.assert:
            that: tinc_daemon_version.stdout_lines | first == 'tinc version ' ~ (tinc_defaults.tinc_version | regex_replace('-[0-9]+$', ''))
            fail_msg: "tincd reports {{ tinc_daemon_version.stdout_lines | first }}, expected {{ tinc_defaults.tinc_version }}"
            success_msg: "tincd reports {{ tinc_daemon_version.stdout_lines | first }}"

        # The interface and its address can only exist if tincd read the rendered
        # tinc.conf, created the interface it names, and ran the rendered tinc-up.
        - name: Show the VPN interface's addresses and routes inside the container
          ansible.builtin.command:
            cmd: docker exec {{ tinc_defaults.tinc_identifier }} ip {{ item }} show dev {{ tinc_defaults.tinc_identifier }}
          register: tinc_interface
          changed_when: false
          until: tinc_interface.rc == 0
          retries: 12
          delay: 5
          loop: [address, route]

        - name: Assert tinc-up gave the interface its address and route
          ansible.builtin.assert:
            that:
              - "'inet ' ~ tinc_expected_interface_address ~ ' ' in tinc_interface.results[0].stdout"
              - tinc_interface.results[1].stdout is search('^' ~ tinc_expected_route ~ ' ', multiline=True)
            fail_msg: >-
              The interface has the addresses {{ tinc_interface.results[0].stdout }}
              and the routes {{ tinc_interface.results[1].stdout }}
            success_msg: "The interface has {{ tinc_expected_interface_address }} and a route to {{ tinc_expected_route }}"

        - name: Retrieve the tinc systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=tinc.service
          register: tinc_log
          changed_when: false

        # tincd reports its debug level on start, which only `tinc_process_extra_arguments`
        # raises, and listens on `::` too unless `AddressFamily = ipv4` from
        # `tinc_additional_configuration` keeps it to IPv4.
        - name: Assert tincd took the process arguments and the additional configuration
          ansible.builtin.assert:
            that:
              - "'starting, debug level 1' in tinc_log.stdout"
              - "'Listening on 0.0.0.0 port 655' in tinc_log.stdout"
              - "'Listening on :: port' not in tinc_log.stdout"
            fail_msg: "The log reads: {{ tinc_log.stdout_lines }}"
            success_msg: "tincd runs at debug level 1 and listens on IPv4 only"

        # ------------------------------------------------------------------
        # A real tunnel, with a peer that connects to the role's container
        # ------------------------------------------------------------------

        # The host files the role rendered are what any node of the network needs,
        # so the peer gets copies of them. That they work for it is part of the test.
        - name: Ensure the peer's hosts directory holds the role's host files
          ansible.builtin.copy:
            src: "/{{ tinc_defaults.tinc_identifier }}/config/hosts/"
            dest: "{{ tinc_molecule_peer_path }}/hosts/"
            remote_src: true
            owner: root
            group: root
            mode: "0644"
            directory_mode: "0755"

        - name: Install the peer's tinc.conf
          ansible.builtin.copy:
            dest: "{{ tinc_molecule_peer_path }}/tinc.conf"
            mode: "0644"
            content: |
              Name = peer
              Interface = tinc
              ConnectTo = molecule

        - name: Install the peer's private key
          ansible.builtin.copy:
            dest: "{{ tinc_molecule_peer_path }}/rsa_key.priv"
            mode: "0600"
            content: "{{ lookup('ansible.builtin.file', tinc_molecule_keys_path ~ '/peer.priv') }}\n"

        # The second address, on the loopback interface, is the network behind the
        # peer, which the role's node only reaches through the route of tinc-up and
        # the second subnet of the peer.
        - name: Install the peer's tinc-up
          ansible.builtin.copy:
            dest: "{{ tinc_molecule_peer_path }}/tinc-up"
            mode: "0755"
            content: |
              #!/bin/sh
              ip link set "$INTERFACE" up
              ip address add {{ tinc_molecule_peer_address }}/24 dev "$INTERFACE"
              ip address add {{ tinc_molecule_peer_lan_address }}/32 dev lo

        - name: Start the peer on the role's container network
          ansible.builtin.command:
            cmd: >-
              docker run --detach --rm
              --name={{ tinc_molecule_peer_name }}
              --network={{ tinc_defaults.tinc_identifier }}
              --cap-drop=ALL --cap-add=NET_ADMIN --device=/dev/net/tun
              --read-only --tmpfs=/run
              --mount type=bind,src={{ tinc_molecule_peer_path }},dst=/etc/tinc,ro
              {{ tinc_container.Config.Image }}
              --config=/etc/tinc --no-detach --debug=1
          changed_when: true

        - name: Wait for the tunnel to carry a ping to the peer (up to 60s)
          ansible.builtin.command:
            cmd: docker exec {{ tinc_defaults.tinc_identifier }} ping -c 1 -W 2 {{ tinc_molecule_peer_address }}
          register: tinc_ping_wait
          changed_when: false
          until: tinc_ping_wait.rc == 0
          retries: 12
          delay: 5

        - name: Ping the peer, the network behind it, and the role's node from the peer
          ansible.builtin.command:
            cmd: docker exec {{ item.container }} ping -c 3 -W 2 {{ item.address }}
          register: tinc_pings
          changed_when: false
          failed_when: false
          loop:
            - {container: "{{ tinc_defaults.tinc_identifier }}", address: "{{ tinc_molecule_peer_address }}"}
            - {container: "{{ tinc_defaults.tinc_identifier }}", address: "{{ tinc_molecule_peer_lan_address }}"}
            - {container: "{{ tinc_molecule_peer_name }}", address: "{{ tinc_expected_address }}"}
          loop_control:
            label: "{{ item.container }} -> {{ item.address }}"

        - name: Assert every ping went through the tunnel
          ansible.builtin.assert:
            that: tinc_pings.results | rejectattr('stdout', 'search', ' 3 packets received') | list | length == 0
            fail_msg: >-
              {% for result in tinc_pings.results %}{{ result.item.container }} -> {{ result.item.address }}:
              {{ result.stdout_lines | select('search', 'packets transmitted') | first | default(result.stderr) }}{% if not loop.last %}; {% endif %}{% endfor %}
            success_msg: "The pings to the peer, the network behind it, and back to the role's node went through the tunnel"

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "tinc_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: tinc_restarts_before
              loop: "{{ tinc_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: tinc_restarts_after
              loop: "{{ tinc_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - tinc_restarts_after.results | map(attribute='status.NRestarts') | list == tinc_restarts_before.results | map(attribute='status.NRestarts') | list
                  - tinc_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in tinc_verify_units | zip(tinc_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in tinc_verify_units | zip(tinc_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in tinc_verify_units | zip(tinc_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the tinc verification summary
          ansible.builtin.debug:
            msg:
              - "tinc systemd: {% for unit, state in tinc_verify_units | zip(tinc_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "tinc restarts: {% for unit, restarts in tinc_verify_units | zip(tinc_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "tinc version: {{ tinc_daemon_version.stdout_lines | first }}"
              - "tinc pings: {% for result in tinc_pings.results %}{{ result.item.address }} ({{ result.stdout_lines | select('search', 'packets transmitted') | first }}){% if not loop.last %}, {% endif %}{% endfor %}"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the tinc systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=tinc.service
          register: tinc_service_log
          changed_when: false

        - name: Show the tinc systemd service log
          ansible.builtin.debug:
            var: tinc_service_log.stdout_lines

        - name: Retrieve the peer's log
          ansible.builtin.command:
            cmd: docker logs {{ tinc_molecule_peer_name }}
          register: tinc_peer_log
          changed_when: false
          failed_when: false

        - name: Show the peer's log
          ansible.builtin.debug:
            var: tinc_peer_log.stderr_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "tinc verification failed. The systemd service log is printed above."

      always:
        - name: Remove the peer
          ansible.builtin.command:
            cmd: docker rm --force {{ tinc_molecule_peer_name }}
          changed_when: true
          failed_when: false
