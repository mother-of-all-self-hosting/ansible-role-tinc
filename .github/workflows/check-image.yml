---
name: Check container image

on:  # yamllint disable-line rule:truthy
  push:
    paths:
      - .github/workflows/check-image.yml
      - Dockerfile
      - bin/smoke-test.sh
  pull_request:
    paths:
      - .github/workflows/check-image.yml
      - Dockerfile
      - bin/smoke-test.sh

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke-test
    runs-on: ubuntu-26.04

    # Same-repository pull requests already run via the push event;
    # run pull_request jobs only for pull requests from forks.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository

    steps:
      - name: Check out
        uses: actions/checkout@v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build for all platforms
        uses: docker/build-push-action@v7.4.0
        with:
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
          context: .
          file: ./Dockerfile

      # Build (from cache) once more for the runner's own platform, so that the
      # image can be loaded into Docker and started.
      - name: Build for the local platform
        uses: docker/build-push-action@v7.4.0
        with:
          load: true
          tags: tinc:check
          context: .
          file: ./Dockerfile

      - name: Smoke-test
        run: ./bin/smoke-test.sh tinc:check
